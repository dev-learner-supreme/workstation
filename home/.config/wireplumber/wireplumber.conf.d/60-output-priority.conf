## Output priority: Bluetooth headphones > wired headphones > Laptop Speakers (EQ).
## HDMI/USB outputs are never picked automatically (still selectable by hand).
## The EQ sink's own priority (1500) lives in
## ~/.config/pipewire/omarchy-speaker-tuning.conf.d/90-tuning.conf.

monitor.bluez.rules = [
  {
    matches = [ { node.name = "~bluez_output.*" } ]
    actions = { update-props = { priority.session = 3000 } }
  }
]

monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*Headphones__sink" } ]
    actions = { update-props = { priority.session = 2000 } }
  }
  {
    matches = [
      { node.name = "~alsa_output.*HDMI.*" }
      { node.name = "~alsa_output.usb-.*" }
    ]
    actions = { update-props = { priority.session = 50 } }
  }
]

## A manual pick holds until a new output appears; then priority decides again.
wireplumber.components = [
  {
    name = output-priority-reset.lua, type = script/lua
    provides = custom.output-priority-reset
    requires = [ metadata.default ]
  }
]

wireplumber.profiles = {
  main = {
    # past picks would otherwise outrank priority (e.g. keep speakers over BT)
    hooks.default-nodes.state = disabled
    # optional: if a future WirePlumber update breaks this script, audio still starts
    custom.output-priority-reset = optional
  }
}
